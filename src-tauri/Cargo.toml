[package]
name = "singo-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "singo_core"
path = "src/lib.rs"

[[bin]]
name = "singo-native-host"
path = "src/bin/native_host.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"
