[package]
name = "singo-download-manager"
version = "1.0.0"
description = "Next-generation high performance download manager"
authors = ["Aria Hajmirza"]
edition = "2021"
default-run = "singo-download-manager"

[lib]
name = "singo_core"
path = "src/lib.rs"

[[bin]]
name = "singo-download-manager"
path = "src/main.rs"

[[bin]]
name = "singo-native-host"
path = "src/bin/native_host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"
