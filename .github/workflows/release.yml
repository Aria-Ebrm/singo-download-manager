name: Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            bin_name: 'singo-native-host.exe'
            release_name: 'singo-windows-x86_64.exe'
          - platform: 'macos-latest'
            bin_name: 'singo-native-host'
            release_name: 'singo-macos-universal'
          - platform: 'ubuntu-22.04'
            bin_name: 'singo-native-host'
            release_name: 'singo-linux-x86_64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Frontend
        run: npm run build

      - name: Build Core Engine (Rust)
        working-directory: src-tauri
        run: cargo build --release

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p release-pkg
          cp src-tauri/target/release/${{ matrix.bin_name }} release-pkg/${{ matrix.release_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singo-${{ matrix.platform }}
          path: release-pkg/${{ matrix.release_name }}

  create-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
