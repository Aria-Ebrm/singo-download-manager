name: Release Multiplatform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            artifact: 'singo-windows.exe'
          - platform: 'macos-latest'
            artifact: 'singo-macos'
          - platform: 'ubuntu-22.04'
            artifact: 'singo-linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Frontend
        run: npm run build

      - name: Build Core Engine (Rust)
        working-directory: src-tauri
        run: cargo build --release

      - name: Generate Checksums
        shell: bash
        run: |
          if [ -d "src-tauri/target/release" ]; then
            cd src-tauri/target/release
            sha256sum singo-native-host* > SHA256SUMS.txt || true
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singo-build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/singo-native-host*
            dist

  create-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            singo-build-*/*
